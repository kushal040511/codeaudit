[project]
name = "codeaudit-backend"
version = "0.1.0"
description = "CodeAudit API + scan workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32,<0.1",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.2,<2",
    # Async jobs
    "celery[redis]>=5.6,<6",
    "redis>=6.4,<6.5",  # kombu (celery[redis]) caps redis <6.5
    # Persistence
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20,<2",
    "psycopg2-binary>=2.9,<3",
    # Encrypting stored OAuth tokens (Fernet)
    "cryptography>=45,<51",
    # Object storage
    "boto3>=1.43,<2",
    # Sandbox: launches analyzer containers
    "docker>=7.2,<8",
    # Analysis tooling
    "semgrep>=1.177,<2",
    "bandit>=1.9,<2",
    "ruff>=0.16,<0.17",
    "pip-audit>=2.10,<3",
    # 0.26.0 corrupts memory (bus error / segfault) when a process parses several files;
    # the architecture analyzer also runs in a child process (graph/isolated.py). Re-test
    # before raising the cap.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "networkx>=3.6,<4",
    # LLM
    "anthropic>=1.5,<2",
    "imagehash>=4.3,<5",
    "pillow>=11,<13",
    "dnspython>=2.7,<3",
    "tldextract>=5.3,<6",
    "prometheus-client>=0.22,<1",
    "sentry-sdk[celery,fastapi]>=2.30,<3",
    "pyyaml>=6,<7",
    "packaging>=24",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "black>=26.5,<27",
    "mypy>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults plus fixture repositories, which contain their own test files.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Postgres, MinIO and a Docker daemon (docker compose stack)"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "^/(alembic/versions|tests/fixtures)/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Runs inside the Playwright image; embeds JavaScript.
"app/services/web/capture_script.py" = ["E501"]
# Evidence labels are user-facing sentences.
"app/services/web/risk.py" = ["E501"]
# Raw HTTP / fixture data in web analyzer tests.
"tests/unit/web/*.py" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "S608", "E501"]
# Model prompt text.
"app/services/web/design.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "S608"]
# Unified-diff fixtures: a blank context line is a single space.
"tests/unit/llm/test_patches.py" = ["S101", "S108", "W293"]
"tests/integration/test_llm_enrichment.py" = ["S101", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/", "^app/services/web/capture_script\\.py$"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*", "networkx.*", "docker.*", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*", "app.core.celery_app"]
disallow_untyped_decorators = false
