version = 1
requires-python = ">=3.12"

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "boto3" },
    { name = "flask" },
    { name = "pyyaml" },
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "black" },
    { name = "pytest" },
]

[[package]]
name = "requests"
version = "2.31.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "idna" },
    { name = "urllib3" },
]

