name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint & types
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check app tests alembic
      - run: uv run black --check app tests
      - run: uv run mypy app

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest -q tests/unit

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    needs: [backend-lint]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: codeaudit, POSTGRES_PASSWORD: codeaudit, POSTGRES_DB: codeaudit }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeaudit" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://codeaudit:codeaudit@localhost:5432/codeaudit
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: codeaudit
      S3_SECRET_ACCESS_KEY: codeaudit-secret
      LOG_FORMAT: text
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=codeaudit -e MINIO_ROOT_PASSWORD=codeaudit-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do curl -sf localhost:9000/minio/health/ready && break; sleep 2; done
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - name: Cache Semgrep rules and OSV databases
        uses: actions/cache@v4
        with:
          path: /tmp/codeaudit-test-workspace
          key: analyzer-data-${{ hashFiles('backend/app/config.py') }}-${{ github.run_id }}
          restore-keys: analyzer-data-${{ hashFiles('backend/app/config.py') }}-
      - name: Build the page-capture sandbox image
        run: docker build -t codeaudit-web-capture:1.63.0 ../docker/web-capture
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade -1 && uv run alembic upgrade head
      # The GitHub API is faked in tests; analyzers run in real sandbox containers.
      - run: uv run pytest -q tests/integration tests/test_health.py

  frontend:
    name: Frontend lint, types & build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  action:
    name: GitHub Action script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv run --project backend --frozen pytest -q backend/tests/unit/test_github_action.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan lockfiles with OSV-Scanner
        run: |
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner:v2.5.1 \
            scan source --lockfile /src/backend/uv.lock --lockfile /src/frontend/package-lock.json \
            --format json > osv.json || true   # exit 1 just means "vulnerabilities found"
      - name: Fail on unreviewed critical vulnerabilities
        run: python3 scripts/ci/dependency_gate.py osv.json
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - name: pip-audit (report)
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip --no-deps -r /tmp/requirements.txt || true
      - name: npm audit (critical fails)
        working-directory: frontend
        run: npm audit --audit-level=critical

  docker-build:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image (API, worker, beat, migrations)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend/Dockerfile
          target: runtime
          tags: codeaudit-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Web image (SPA + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/frontend/Dockerfile
          tags: codeaudit-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id codeaudit-backend:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id codeaudit-web:ci -u)" = "10002"
      - name: Compose files are valid
        run: |
          touch .env .env.production
          docker compose config -q
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci docker compose -f docker-compose.prod.yml config -q
